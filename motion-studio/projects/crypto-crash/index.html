/* ================= PRICE (closed form, drives the live chart) ================= */
const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const noise = t => Math.sin(t * 17.3) * .5 + Math.sin(t * 7.1 + 1) * .35 + Math.sin(t * 31.7 + 2) * .15;
function price(t) {
  if (t < 3.62) return 9800 + 2680 * sm(t / 3.6) + noise(t) * 70;
  if (t < 4.6) { const q = (t - 3.62) / .98; return 12480 - 11240 * Math.pow(q, 2.2) + noise(t) * 260 * (1 - q); }
  if (t < 12.9) return 1240 - 260 * sm((t - 4.6) / 8) + noise(t) * 40;
  if (t < 14.7) return 980 + 47000 * Math.pow(sm((t - 12.9) / 1.6), 2.4) + noise(t) * 300;
  if (t < 22.2) return 48000;
  if (t < 23) return 48000 - 47988 * Math.pow((t - 22.2) / .8, .5);
  return 12 + noise(t) * .6;
}
const fmt = v => '$' + Math.max(0, Math.round(v)).toLocaleString('en-US');
BM.everyFrame(t => {
  const pts = [], N0 = 70, win0 = 4; let mn = 1e12, mx = -1;
  for (let i = 0; i <= N0; i++) { const tt = Math.max(0, t - win0 + i / N0 * win0), v = price(tt); pts.push(v); mn = Math.min(mn, v); mx = Math.max(mx, v); }
  const pad = (mx - mn) * .12 + 1, y0 = 402, y1 = 170, x0 = 30, x1 = 630;
  const P = pts.map((v, i) => [x0 + (x1 - x0) * i / N0, y0 - (v - mn + pad) / (mx - mn + 2 * pad) * (y0 - y1)]);
  const d = P.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  chartLine.setAttribute('d', d); chartArea.setAttribute('d', `${d} L${x1} ${y0} L${x0} ${y0} Z`);
  const v = price(t), up = price(t) >= price(Math.max(0, t - .4)), col = up ? C.green : C.red;
  chartLine.setAttribute('stroke', col); stopA.setAttribute('stop-color', col); stopB.setAttribute('stop-color', col); tvGlow.setAttribute('fill', col);
  monVal.textContent = fmt(v); monVal.setAttribute('fill', col);
  const pct = (v / 9800 - 1) * 100; monPct.textContent = (pct >= 0 ? '+' : '') + (Math.abs(pct) < 10 || Math.abs(pct) > 99 ? pct.toFixed(1) : Math.round(pct)) + '%'; monPct.setAttribute('fill', col);
  // ambient life: clock, plant, poster flame, city lights, steam, wheels, palms

const cg = { h: 0 }; tl.to(cg, { h: 3200, duration: .8, ease: 'power2.out', onUpdate() { candleBody.setAttribute('y', 1420 - cg.h); candleBody.setAttribute('height', cg.h); wick.setAttribute('y', 1420 - cg.h - 90); wick.setAttribute('height', cg.h + 90); } }, PU + 1.0);
BM.sfx(PU + 1.0, 'impact', .7); tl.to(candleGlow, { opacity: 1, duration: .6 }, PU + 1.1); BM.shake(ROOM, PU + 1.0, 16, .9, 30);
BM.cam(ROOM, PU + 1.55, 760, -700, 1.2, .55, 'power3.in');                                          // ride the candle up
// --- S5 · the fantasy (15 – 22.15)
const FA = T.fantasy; BM.cut(FA, ROOM, FAN); BM.sfx(FA, 'whoosh', 1); BM.sfx(FA + .1, 'register', .9);
Object.assign(FAN.cam, { x: 540, y: 300, z: 1.1 }); FAN.apply(); tl.set(FAN.cam, { x: 540, y: 300, z: 1.1, onUpdate: FAN.apply }, FA);
BM.cam(FAN, FA, 540, 1100, 1.2, 1.3, 'power3.out');
expr(D2, FA, 'ecstatic', .01); pose(D2, FA, { Larm: -120, Lfore: -40, Rarm: 60, Rfore: -20 }, .01);
tl.fromTo(planeJ, { tx: 1300 }, { tx: -700, duration: 6.5, ease: 'none', onUpdate: planeJ.apply, immediateRender: false }, FA + .4);
money.forEach((m, i) => { const at = FA + .3 + (i % 13) * .42 + Math.floor(i / 13) * .2, x0 = hash(i) * 1080;
  m.tx = x0; m.ty = -120; m.apply(); tl.set(m.el, { opacity: 1 }, at);
  tl.to(m, { ty: 1700, tx: x0 + (hash(i + 5) - .5) * 300, duration: 2.6 + hash(i) * 1.2, ease: 'none', onUpdate: m.apply }, at);
  tl.fromTo(m, { r: -30, sx: 1 }, { r: 40, sx: -1, duration: .5, yoyo: true, repeat: 7, ease: 'sine.inOut', onUpdate: m.apply, immediateRender: false }, at); });
coins.forEach((c, i) => { const at = FA + 1 + i * .5; c.tx = 150 + hash(i * 3) * 780; c.ty = 1250; c.apply(); tl.set(c.el, { opacity: 1 }, at);
  tl.to(c, { keyframes: [{ ty: 900 - hash(i) * 200, duration: .45, ease: 'power2.out' }, { ty: 1500, duration: .55, ease: 'power2.in' }], onUpdate: c.apply }, at);
  tl.fromTo(c, { sx: 1 }, { sx: .1, duration: .12, yoyo: true, repeat: 7, onUpdate: c.apply, immediateRender: false }, at); BM.sfx(at, 'coin', .45); });
tl.fromTo(carJ, { y: 0 }, { y: -6, duration: .18, yoyo: true, repeat: 38, ease: 'sine.inOut', onUpdate: carJ.apply, immediateRender: false }, FA);
BM.sway(D2.Larm, FA + .6, 14, .35, T.smash - .2);                                                    // waving the cash fan
BM.cam(FAN, FA + 2.2, 520, 1080, 1.36, 2.4, 'sine.inOut');
// the sunglasses slide down to show $ eyes, brow wiggle
BM.jto(D2.gj, FA + 2.4, { y: 34 }, .35, 'back.out(2)'); BM.sfx(FA + 2.4, 'boing', .5);
tl.to(D2.F, { bq: -18, duration: .12, yoyo: true, repeat: 5, onUpdate: D2.F.apply }, FA + 2.8); BM.jto(D2.gj, FA + 3.8, { y: 0 }, .25);
// champagne pop
const CH = FA + 4.4; pose(D2, CH - .4, { Rarm: 150, Rfore: 20 }, .35); BM.sfx(CH, 'pop', 1);
tl.to(corkJ, { ty: -900, tx: 120, r: 720, duration: .9, ease: 'power2.out', onUpdate: corkJ.apply }, CH);
foam.forEach((f, i) => { const a = -Math.PI / 2 + (hash(i) - .5) * 1.2, v = 300 + hash(i + 4) * 320;
  tl.fromTo(f, { attr: { cx: 315, cy: 760 }, opacity: 1 }, { attr: { cx: 315 + Math.cos(a) * v, cy: 760 + Math.sin(a) * v + 260 }, opacity: 0, duration: 1.0, ease: 'power1.out', immediateRender: false }, CH + i * .02); });
BM.cam(FAN, CH, 560, 1060, 1.22, 1.4, 'sine.inOut'); blink(D2, CH + 1.5);
BM.music(FA, T.smash, 'hype', .85); BM.sfx(FA + 5.6, 'horn', .6);
// --- S6 · the red candle smashes it (22.15 – 24.4)
const SM = T.smash; BM.sfx(SM - .5, 'fall', .9); expr(D2, SM - .45, 'shock', .1); tl.to(D2.F, { ly: -14, duration: .2, onUpdate: D2.F.apply }, SM - .45);
tl.set(redC, { opacity: 1 }, SM - .5); tl.to(redJ, { ty: 1290, duration: .5, ease: 'power3.in', onUpdate: redJ.apply }, SM - .5);
BM.sfx(SM, 'impact', 1); BM.sfx(SM + .05, 'shatter', .9); BM.shake(FAN, SM, 40, .7);
tl.to(flashW, { opacity: .9, duration: .04 }, SM); tl.to(flashW, { opacity: 0, duration: .3 }, SM + .06);
BM.pop(bBonk.g, SM + .08, .25); BM.hide(bBonk.g, SM + .9, .2);
tl.to(carJ, { sx: .22, sy: .22, duration: .35, ease: 'back.in(2)', onUpdate: carJ.apply }, SM + .15); BM.sfx(SM + .2, 'boing', .8);
tl.to(cracks, { opacity: 1, attr: { 'stroke-dashoffset': 0 }, duration: .4, ease: 'power2.out' }, SM + .3);
tl.to(fp, { filter: 'saturate(0) brightness(.85)', duration: .5 }, SM + .3);
BM.sfx(SM + 1.25, 'whoosh', .8);
tl.to(FAN.cam, { oy: -2600, r: -6, duration: .7, ease: 'power3.in', onUpdate: FAN.apply }, SM + 1.25);
// --- S7 · reality, and the twitch (24.4 – 30)
const RE = T.reality; BM.cut(RE, FAN, ROOM); BM.sfx(RE, 'thud', .8);
tl.set(fp, { filter: 'none' }, RE);
tl.set(ROOM.cam, { x: 540, y: 1040, z: 1.3, onUpdate: ROOM.apply }, RE);
tl.set([candleGlow], { opacity: 0 }, RE); tl.set(candleBody, { attr: { height: 0 } }, RE); tl.set(wick, { attr: { height: 0 } }, RE);
tl.set(tintBack, { fill: '#2A4BFF', opacity: .24 }, RE); tl.set(scrGlow, { fill: C.red, opacity: .18 }, RE);
tl.set(toyCar, { opacity: 1 }, RE); tl.set(D1.glasses, { opacity: 1 }, RE); tl.set(D1.crack, { opacity: 1 }, RE); BM.jto(D1.gj, RE, { y: -70, r: -8 }, .01);
pose(D1, RE, { Rarm: 8, Rfore: 4, Larm: 125, Lfore: -36, head: 0, torso: 0 }, .01); tl.set(mug, { opacity: 1 }, RE); tl.set(deskMug, { opacity: 0 }, RE);
expr(D1, RE, 'deadpan', .01); BM.cam(ROOM, RE + .2, 540, 1000, 1.44, 1.6, 'sine.inOut');
pose(D1, RE + 1.0, { Larm: 150, Lfore: -58 }, .45); mouth(D1, RE + 1.3, 'slurp'); BM.sfx(RE + 1.35, 'slurp_empty', .9);
pose(D1, RE + 2.0, { Larm: 125, Lfore: -36 }, .4); mouth(D1, RE + 2.0, 'flat'); blink(D1, RE + 2.2);

const NO = T.notif; tl.to(phoneJ, { keyframes: [{ x: -6, duration: .04 }, { x: 6, duration: .04 }], repeat: 6, onUpdate: phoneJ.apply }, NO); BM.sfx(NO, 'buzz', .8);

BM.sfx(NO + .8, 'twitch', .7); BM.cam(ROOM, NO + .5, 470, 1080, 1.36, .6, 'power2.inOut'); BM.cam(ROOM, NO + 1.25, 530, 1030, 1.85, .9, 'power2.inOut');
expr(D1, NO + 1.4, 'sly', .4); BM.sfx(NO + 1.5, 'cash_tiny', .6); tl.to(D1.blush, { opacity: .7, duration: .3 }, NO + 1.5);
tl.to(D1.F, { bq: -20, duration: .12, yoyo: true, repeat: 3, onUpdate: D1.F.apply }, NO + 1.6);
BM.music(RE, T.end, 'lofi_broke', .7);
// end card
const EN = T.end; BM.show(endCard, EN, .35); BM.hide(notif, EN, .2); BM.sfx(EN, 'sting', 1);
tl.fromTo(dJ, { sx: .2, sy: .2, r: -20 }, { sx: 1, sy: 1, r: 0, duration: .5, ease: 'back.out(2)', onUpdate: dJ.apply, immediateRender: false }, EN + .1);
tl.set(dCrack, { opacity: 1 }, EN + .95); BM.sfx(EN + .95, 'crack', .8); tl.to(dJ, { keyframes: [{ x: -6, duration: .04 }, { x: 6, duration: .04 }, { x: 0, duration: .04 }], onUpdate: dJ.apply }, EN + .95);
// idle life: breathing + blinks
BM.sway(D1.torso, 0, 1.2, 1.7, T.crash); blink(D1, 3.0); blink(D1, 9.1); blink(D1, 25.2);
BM.sway(D2.torso, FA, 2, .9, T.smash);
BM.finish();
}
